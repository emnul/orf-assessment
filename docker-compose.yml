services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orf_user
      POSTGRES_PASSWORD: orf_pass
      POSTGRES_DB: orf
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orf_user -d orf"]
      interval: 3s
      timeout: 3s
      retries: 10

  scoring:
    build: ./scoring
    ports:
      - "8000:8000"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://orf_user:orf_pass@db:5432/orf
      SCORING_SERVICE_URL: http://scoring:8000
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      scoring:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - api
